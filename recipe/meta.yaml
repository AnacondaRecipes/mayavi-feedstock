{% set version = "4.9.0" %}

package:
  name: mayavi
  version: {{ version }}

source:
  url: https://github.com/enthought/mayavi/archive/{{ version }}.tar.gz
  sha256: f2e6d990c47e0cda6c795242a5e612e4c5291bbef4a0e42b4e7d65d83c01be3c
  patches:
    - patches/0001-fix-runtests.patch

build:
  number: 0
  entry_points:
    - mayavi2 = mayavi.scripts.mayavi2:main
    - tvtk_doc = tvtk.tools.tvtk_doc:main
  ignore_run_exports:
    - pyqt  # [linux and aarch64]
  # No vtk for osx-64; upstream requires-python >=3.10
  skip: true  # [py<310 or (osx and x86_64)]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    # C extension removed in 4.9.0; patch still needed for runtests decode fix
    - patch  # [not win]
    - m2-patch  # [win]
  host:
    - python
    - pip
    # pyproject.toml build-system: setuptools>=77, setuptools_scm>=8, vtk>=9.4, numpy
    - setuptools >=77
    - setuptools-scm >=8
    - numpy {{ numpy }}
    # 9.6.2 *_2 coinstalls with CBC pyqt 6.11 (qtbase 6.11); 9.4.1 *_2 needs qtbase 6.7
    - vtk-base 9.6.2 *_2
    - pyqt {{ pyqt }}
  run:
    - python
    - apptools
    - configobj
    - envisage
    - numpy
    - pyface >=6.1.1
    - pygments
    - traits >=6.0.0
    - traitsui >=7.0.0
    - packaging
    - importlib_resources  # [py<311]
    - vtk-base >=9.6.2,<9.8 *_2
    - puremagic
    - pyqt
  run_constrained:
    # envisage.api still imports pkg_resources (removed in setuptools 82); app extra
    - setuptools <82

test:
  source_files:
    - mayavi/tests
    - tvtk/tests
  requires:
    - pip
    - pytest
  commands:
    - mayavi2 --help
    - pip check
    - ETS_TOOLKIT=null pytest --import-mode=importlib mayavi/tests  # [linux]
    - pytest --import-mode=importlib mayavi/tests tvtk/tests  # [not linux]
  imports:
    - mayavi
    - tvtk
    - tvtk.api
    - tvtk.array_ext
    - tvtk.common
    - tvtk.array_handler
    - mayavi.core
    - mayavi.sources
    - mayavi.modules
    - mayavi.filters
    - mayavi.tools
    # Skip mlab import test as it requires GUI context
    # - mayavi.mlab

about:
  home: https://github.com/enthought/mayavi
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE.txt
    - LICENSE_COLORBREWER.txt
    - LICENSE_YORICK.txt
  summary: The Mayavi scientific data 3-dimensional visualizers
  description: |
    Mayavi is a general purpose, cross-platform tool for 2-D and 3-D scientific data visualization.
    It provides easy and interactive visualization of data, with a GUI that can be used by novices,
    and a Python API for advanced users. Mayavi is built on top of VTK (Visualization Toolkit) and
    provides a Pythonic interface to VTK. It can be used both as an interactive program or as a
    programming library. Mayavi integrates seamlessly with numpy and scipy for scientific computing
    and can be embedded in various GUI toolkits.
  doc_url: https://docs.enthought.com/mayavi/mayavi
  dev_url: https://github.com/enthought/mayavi

extra:
  recipe-maintainers:
    - msarahan
    - grlee77
    - hadim
    - dfroger
    - cadair
  skip-lints:
    - missing_wheel
